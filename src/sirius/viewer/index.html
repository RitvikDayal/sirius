<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIRIUS live</title>
<style>
  :root { --bg: #0d1014; --panel: #161b22; --line: #2a313c; --text: #d7dde5; --muted: #8b95a3; --accent: #7cc4ff; --warn: #ffb454; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 18px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .08em; }
  #stats { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stats b { color: var(--text); font-weight: 600; }
  #stats .warn b { color: var(--warn); } #stats .bad b { color: var(--bad); }
  #speech { margin-left: auto; color: var(--accent); font-weight: 600; min-height: 1.4em; }
  #mute { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  #mute[aria-pressed="true"] { background: #3a1d1d; border-color: var(--bad); color: var(--bad); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; padding: 10px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  figcaption { padding: 6px 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; }
  #cloud { grid-column: 1 / -1; }
  #cloud canvas { display: block; width: 100%; height: min(60vh, 560px); }
</style>
<script type="importmap">{ "imports": { "three": "/static/three.module.js" } }</script>
</head>
<body>
<header>
  <h1>SIRIUS</h1>
  <div id="stats">waiting for the pipeline…</div>
  <div id="speech"></div>
  <button id="mute" type="button" aria-pressed="false">🔊 Voice on</button>
</header>
<main>
  <figure><figcaption>Left camera</figcaption><img src="/stream/left" alt="left camera"></figure>
  <figure><figcaption>Right camera</figcaption><img src="/stream/right" alt="right camera"></figure>
  <figure><figcaption>Depth (near = warm, far = cool)</figcaption><img src="/stream/depth" alt="depth map"></figure>
  <figure><figcaption>Objects</figcaption><img src="/stream/objects" alt="detected objects"></figure>
  <figure id="cloud"><figcaption>3D view of the current frame (drag to orbit, scroll to zoom)</figcaption></figure>
</main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "/static/OrbitControls.js";

const host = document.getElementById("cloud");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1014);
const camera = new THREE.PerspectiveCamera(60, 2, 0.05, 100);
camera.position.set(0, -0.6, -1.6);   // behind and above the rig, looking forward (+z)
camera.up.set(0, -1, 0);              // camera frame: y points down
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 2.5);
controls.update();

const grid = new THREE.GridHelper(10, 20, 0x2a313c, 0x1c222b);
grid.position.set(0, 1.2, 5);          // a floor ~1.2 m below the rig
scene.add(grid);
const rig = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, 0.03), new THREE.MeshBasicMaterial({ color: 0x7cc4ff }));
scene.add(rig);

const geom = new THREE.BufferGeometry();
const mat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true });
scene.add(new THREE.Points(geom, mat));

function resize() {
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

async function pollPoints() {
  try {
    const buf = await (await fetch("/points", { cache: "no-store" })).arrayBuffer();
    const n = new DataView(buf).getUint32(0, true);
    if (n > 0) {
      const xyz = new Float32Array(buf, 4, n * 3);
      const rgb = new Uint8Array(buf, 4 + n * 12, n * 3);
      geom.setAttribute("position", new THREE.BufferAttribute(xyz.slice(), 3));
      geom.setAttribute("color", new THREE.BufferAttribute(rgb.slice(), 3, true));
      geom.computeBoundingSphere();
    }
  } catch (e) { /* pipeline restarting */ }
  setTimeout(pollPoints, 150);
}
pollPoints();

const statsEl = document.getElementById("stats"), speechEl = document.getElementById("speech");
const muteBtn = document.getElementById("mute");
function showMute(m) {
  muteBtn.setAttribute("aria-pressed", String(m));
  muteBtn.textContent = m ? "🔇 Muted" : "🔊 Voice on";
}
muteBtn.addEventListener("click", async () => {
  const want = muteBtn.getAttribute("aria-pressed") !== "true";
  const r = await fetch("/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mute: want }) });
  showMute((await r.json()).mute);
});
async function pollStats() {
  try {
    const s = await (await fetch("/stats", { cache: "no-store" })).json();
    const items = Object.entries(s).filter(([k]) => !["speech", "level", "muted"].includes(k));
    statsEl.innerHTML = items.map(([k, v]) => {
      const cls = (s.level && s.level[k]) || "";
      return `<span class="${cls}">${k.replaceAll("_", " ")} <b>${typeof v === "number" ? v.toFixed(1) : v}</b></span>`;
    }).join("");
    if (s.speech) speechEl.textContent = "🔊 " + s.speech;
    if (typeof s.muted === "boolean") showMute(s.muted);
  } catch (e) { statsEl.textContent = "pipeline not running"; }
  setTimeout(pollStats, 250);
}
pollStats();

(function loop() { renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
